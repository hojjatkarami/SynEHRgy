# GPT2Config

config_class: GPT2Config
model_class: GPT2LMHeadModel


config:
  n_embd: 384                     # hidden size
  # n_inner: 1024                   # intermediate size
  n_layer: 4                      # number of transformer layers
  n_head: 4                       # number of attention heads
  # n_positions: ${.n_ctx}               # maximum sequence length
  
  # activation_function: "gelu"     # GPT-2 uses gelu (closest to silu)
  # resid_pdrop: 0.1
  # embd_pdrop: 0.1
  # attn_pdrop: 0.1
  # layer_norm_epsilon: 1e-5
  # initializer_range: 0.02
  # use_cache: false
  # tie_word_embeddings: true

  # note: GPT2Config does not have "num_key_value_heads" or "attn_implementation"
  # multi-head attention is symmetric (num_heads = num_kv_heads)



training:
  learning_rate: 0.002
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 2

  warmup_ratio: 0.015
  lr_scheduler_type: "cosine"
  weight_decay: 0.1
  max_grad_norm: 1.0

  bf16: true
  fp16: false
  gradient_checkpointing: true

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
