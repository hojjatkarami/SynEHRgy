defaults:
  - data: mimic3
  - model_config:

  - _self_

hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

run_name: TEST

wandb:
  project: SynEHRgy

mode: pretrain # pretrain or fcast # fcast is UNDER DEVELOPMENT
base_model: full-icd-big-uni2[v1] # relevant if mode is fcast

preprocess:
  label_shuffle: False
  ts_shuffle: False
  mask_prob: 0.0 # probablity of a token being masked
  truncate: true
  split: false
  bin_type: uniform # uniform or quantile or raw

use_pretrained: False
ignore_ts: False
model: gpt # bart or gpt

train:
  epochs: 20
  patience: 5
  gclip: 1
  ratio: 1 # low ratio can be used for debug mode

hparams:
  lr: 3e-4
  batch_size: 128
  mini_batch: 64
  n_ctx: 1024
  n_embd: 384
  n_layer: 4
  n_head: 4

loss:
  soft_labels: False
  n_next: 1


# ==== Training ====
training:
  # we also have training configs in model_config.training

  # generic
  per_device_eval_batch_size: 64
  eval_accumulation_steps: 1
  prediction_loss_only: true

  logging_steps: 25
  save_total_limit: 20
  eval_strategy: "steps"
  eval_steps: 250

  max_steps: -1 # will be computed if budget is set
  num_train_epochs: 2 # will be ignored if max_steps > 0

  dataloader_num_workers: 8